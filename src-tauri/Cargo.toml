[package]
name = "automat-process"
version = "0.1.0"
description = "Automat-Process : documents personnalisés à partir d'un modèle et d'une liste"
authors = ["Eau sèche <gneguev@gmail.com>"]
edition = "2024"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows (rust-lang/cargo#8519).
name = "automat_process_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Déjà utilisées par Typst : lecture des dimensions des PDF et des images importés.
hayro-syntax = "0.7"
imagesize = "0.14"
tiny-skia = "0.12"
qrcode = { version = "0.14", default-features = false }
# Lecture et retrait ciblé des balises dans les modèles PDF.
lopdf = { version = "0.46", default-features = false }
# Vignettes JPEG de la mosaïque, photos des agents et effacement intelligent (déjà compilé pour Typst).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Fichiers de projet « .automat » (archives ZIP).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts", "datetime"] }

# Impression directe (imprimantes à cartes PVC) par le pilote Windows ; déjà compilé pour Tauri.
# Reconnaissance de caractères et détection des visages intégrées à Windows 10/11, hors ligne
# (Windows.Media.Ocr, Windows.Media.FaceAnalysis).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_FaceAnalysis",
    "Media_Ocr",
    "Storage_Streams",
] }

# Voir https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Typst est lent en mode debug non optimisé : on optimise les dépendances même en développement.
[profile.dev.package."*"]
opt-level = 2
