<?xml version="1.0" encoding="UTF-8"?>
<!-- Fond Teams / Zoom d'exemple d'Automat-Process (1920 × 1080 px). Les textes entre doubles
     accolades sont les colonnes de la liste d'exemple : l'application les place d'elle-même. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8f8"/>
      <stop offset="1" stop-color="#d4e4e5"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#fond)"/>
  <circle cx="1730" cy="150" r="380" fill="#1e6e72" fill-opacity="0.10"/>
  <circle cx="1840" cy="930" r="230" fill="#e76f51" fill-opacity="0.10"/>
  <rect y="1040" width="1920" height="40" fill="#1d3557"/>
  <circle cx="130" cy="118" r="34" fill="#1d3557"/>
  <circle cx="146" cy="102" r="15" fill="#e76f51"/>
  <text x="188" y="134" font-family="Arial" font-weight="700" font-size="44" letter-spacing="2" fill="#1d3557">EXEMPLE SA</text>
  <text x="96" y="890" font-family="Arial" font-weight="700" font-size="66" fill="#1d3557">{{Prénom}} {{NOM}}</text>
  <text x="96" y="958" font-family="Arial" font-size="40" fill="#e76f51">{{Fonction}}</text>
  <rect x="96" y="990" width="150" height="8" fill="#e76f51"/>
</svg>
